<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Déployer SPL Gestion de Suivi</title>
  <style>
    body{margin:0;background:#05070c;color:#e6ebf4;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px}.box{max-width:650px;background:#0a0f1a;border:1px solid #1f2937;border-radius:18px;padding:30px}h1{margin-top:0}label{display:block;margin:18px 0 7px;color:#94a3b8;font-size:13px;font-weight:700}input{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;border:1px solid #334155;background:#111827;color:white}.btn{display:inline-block;margin-top:22px;border:0;border-radius:9px;background:#2f6bff;color:white;padding:13px 20px;font-weight:700;cursor:pointer}.note{color:#94a3b8;line-height:1.6;font-size:14px}.error{color:#fca5a5;margin-top:12px;font-size:13px}</style>
</head>
<body>
  <main class="box">
    <h1>SPL Gestion de Suivi</h1>
    <p class="note">Entrez votre nom GitHub après avoir importé le projet dans un dépôt nommé <strong>spl-gestion</strong>. Ce bouton ouvrira Vercel avec toute la configuration déjà préparée.</p>
    <label for="github">Votre nom d’utilisateur GitHub</label>
    <input id="github" placeholder="exemple : amadou123" autocomplete="off" />
    <button class="btn" onclick="deploy()">Déployer sur Vercel →</button>
    <p id="error" class="error"></p>
  </main>
  <script>
    function deploy(){
      const user=document.getElementById('github').value.trim().replace(/[^a-zA-Z0-9_-]/g,'');
      if(!user){document.getElementById('error').textContent='Saisissez votre nom GitHub.';return}
      const repo=`https://github.com/${user}/spl-gestion`;
      const params=new URLSearchParams({
        'repository-url':repo,
        'project-name':'spl-gestion-de-suivi',
        'repository-name':'spl-gestion',
        env:'DATABASE_URL,SPL_SESSION_SECRET',
        envDescription:'Configuration SPL Gestion de Suivi',
        envLink:`${repo}/blob/main/.env.example`
      });
      location.href=`https://vercel.com/new/clone?${params.toString()}`;
    }
  </script>
</body>
</html>
